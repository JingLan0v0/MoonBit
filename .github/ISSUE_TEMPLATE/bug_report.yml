name: Bug report
description: Report a reproducible MoonRow defect
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide synthetic CSV inputs, command, and Node/MoonBit versions. Do not include private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
